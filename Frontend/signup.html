<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VENYORA | Luxury Fashion</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#f7f3ee;
min-height:100vh;
}

.wrapper{
display:flex;
min-height:100vh;
}

/* LEFT SIDE */

.left{
flex:1;
overflow:hidden;
position:relative;
}

.left img{
width:100%;
height:100vh;
object-fit:cover;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,0.25);
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
}

.overlay-content{
color:white;
}

.overlay-content h1{
font-family:'Cormorant Garamond',serif;
font-size:72px;
letter-spacing:8px;
font-weight:600;
}

.overlay-content p{
margin-top:15px;
font-size:16px;
letter-spacing:3px;
}

/* RIGHT */

.right{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:40px;
background:#f7f3ee;
}

.auth-card{
width:100%;
max-width:450px;
background:rgba(255,255,255,0.9);
backdrop-filter:blur(15px);
padding:50px;
border-radius:24px;
box-shadow:0 20px 50px rgba(0,0,0,0.08);
border:1px solid rgba(0,0,0,0.05);
}

/* BRAND */

.brand{
font-family:'Cormorant Garamond',serif;
font-size:52px;
letter-spacing:8px;
text-align:center;
color:#111;
}

.tagline{
text-align:center;
margin-top:5px;
margin-bottom:35px;
font-size:13px;
letter-spacing:3px;
color:#888;
}

.form-title{
text-align:center;
font-size:24px;
margin-bottom:30px;
font-weight:500;
color:#111;
}

/* INPUTS */

.form-group{
margin-bottom:22px;
}

input{
width:100%;
padding:14px 0;
border:none;
border-bottom:1px solid #ddd;
background:transparent;
font-size:15px;
transition:.3s;
}

input:focus{
outline:none;
border-bottom:1px solid #b89b72;
}

/* FORGOT */

.forgot{
text-align:right;
margin-bottom:25px;
font-size:14px;
color:#777;
cursor:pointer;
}

/* BUTTON */

button{
width:100%;
padding:15px;
border:none;
background:#111;
color:white;
letter-spacing:2px;
text-transform:uppercase;
font-size:13px;
font-weight:600;
cursor:pointer;
transition:.3s;
border-radius:10px;
}

button:hover{
background:#b89b72;
}

/* TOGGLE */

.toggle-text{
margin-top:25px;
text-align:center;
font-size:14px;
color:#666;
}

.toggle-text a{
color:#b89b72;
font-weight:600;
cursor:pointer;
text-decoration:none;
}

.hidden{
display:none;
}

/* MOBILE */

@media(max-width:768px){

body{
    background:#000;
}

.wrapper{
    position:relative;
    min-height:100vh;
}

/* Full screen fashion image */

.left{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height: 50vh;
    display:block;
    z-index:1;
}

.left img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    object-position:center center;
}

/* Dark luxury overlay */

.overlay{
    background:
    linear-gradient(
        to bottom,
        rgba(0,0,0,0.25),
        rgba(0,0,0,0.55),
        rgba(0,0,0,0.75)
    );
}

/* VENYORA branding */

.overlay-content{
    position:absolute;
    top:90px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
}

.overlay-content h1{
    font-size:44px;
    letter-spacing:8px;
    color:white;
}

.overlay-content p{
    margin-top:10px;
    color:#f1f1f1;
    letter-spacing:3px;
    font-size:12px;
}

/* Floating luxury card */

.right{
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding:0;
    position:relative;
    z-index:2;
}

.auth-card{
    width:100%;
    max-width:none;
    margin-top: 35vh;
    background:rgba(255,255,255,0.96);
    backdrop-filter:blur(18px);

    border-radius:35px 35px 0 0;

    padding:
        35px
        25px
        calc(35px + env(safe-area-inset-bottom));

    box-shadow:
        0 -15px 50px rgba(0,0,0,0.25);

    animation:slideUp .6s ease;
}

/* Hide duplicate logo */

.brand{
    display:none;
}

.tagline{
    display:none;
}

.form-title{
    font-size:28px;
    margin-bottom:25px;
    color:#111;
}

/* Premium inputs */

input{
    background:#fafafa;
    border:none;
    border-radius:14px;
    padding:16px 18px;
    margin-bottom:10px;
    font-size:15px;
}

input:focus{
    background:white;
    box-shadow:
        0 0 0 2px #b89b72;
}

/* Luxury button */

button{
    margin-top:10px;
    border-radius:14px;
    background:linear-gradient(
        135deg,
        #111,
        #2b2b2b
    );

    height:56px;
    font-size:13px;
    letter-spacing:3px;
}

button:hover{
    background:linear-gradient(
        135deg,
        #b89b72,
        #c9ab80
    );
}

.toggle-text{
    margin-top:20px;
}

.forgot{
    margin-top:5px;
}

@keyframes slideUp{
    from{
        transform:translateY(60px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

}

/* Dark premium auth theme — photography is deliberately untouched. */
body.auth-page { background: #111410; color: #f2f0e8; }
.auth-page .right { background: radial-gradient(circle at 80% 10%, rgba(87,110,89,.18), transparent 28rem), #151a15; }
.auth-page .auth-card { background: rgba(29,35,29,.88); border-color: rgba(242,240,232,.12); box-shadow: 0 20px 50px rgba(0,0,0,.35); }
.auth-page .brand, .auth-page .form-title { color: #f2f0e8; }.auth-page .tagline, .auth-page .toggle-text, .auth-page .forgot { color: #b8c1b8; }
.auth-page input { border-color: rgba(242,240,232,.24); color: #f2f0e8; }.auth-page input::placeholder { color: #aeb6aa; }.auth-page input:focus { border-color: #d6b288; }
.auth-page button:not(.auth-theme-toggle) { background: #d6b288; color: #172018; }.auth-page button:not(.auth-theme-toggle):hover { background: #eee7db; }
.auth-page .toggle-text a { color: #d6b288; }
.auth-theme-toggle { align-items: center; background: rgba(17,20,16,.8); border: 1px solid rgba(242,240,232,.2); border-radius: 999px; color: #f2f0e8; cursor: pointer; display: inline-flex; font: 500 .72rem 'Poppins', sans-serif; gap: .45rem; letter-spacing: .04em; padding: .6rem .85rem; position: fixed; right: 1.25rem; top: 1.25rem; width: auto; z-index: 10; }
.auth-theme-toggle:hover { background: #d6b288; color: #172018; }
body.auth-page[data-theme="light"] { background: #f7f3ee; color: #111; }.auth-page[data-theme="light"] .right { background: #f7f3ee; }.auth-page[data-theme="light"] .auth-card { background: rgba(255,255,255,.9); border-color: rgba(0,0,0,.05); box-shadow: 0 20px 50px rgba(0,0,0,.08); }.auth-page[data-theme="light"] .brand, .auth-page[data-theme="light"] .form-title { color: #111; }.auth-page[data-theme="light"] .tagline, .auth-page[data-theme="light"] .toggle-text, .auth-page[data-theme="light"] .forgot { color: #777; }.auth-page[data-theme="light"] input { border-color: #ddd; color: #111; }.auth-page[data-theme="light"] .auth-theme-toggle { background: rgba(255,255,255,.88); border-color: rgba(0,0,0,.15); color: #111; }
@media(max-width:768px) { .auth-theme-toggle { right: 1rem; top: 1rem; }.auth-page .auth-card { background: rgba(20,25,20,.96); }.auth-page[data-theme="light"] .auth-card { background: rgba(255,255,255,.96); } }
</style>
</head>

<body class="auth-page">

<button type="button" class="auth-theme-toggle" id="auth-theme-toggle" aria-label="Switch to light mode"><i class="ri-sun-line"></i><span>Light</span></button>

<div class="wrapper">

<div class="left">

<img src="signup.png" alt="VENYORA Fashion">

<div class="overlay">
<div class="overlay-content">
<h1>VENYORA</h1>
<p>ELEGANCE IN EVERY THREAD</p>
</div>
</div>

</div>

<div class="right">

<div class="auth-card">

<h1 class="brand">VENYORA</h1>
<p class="tagline">LUXURY FASHION REDEFINED</p>

<!-- LOGIN -->

<div id="login-form">

<h3 class="form-title">Welcome Back</h3>

<form id="login-form-element">

<div class="form-group">
<input type="email" id="login-email" placeholder="Email Address" required>
</div>

<div class="form-group">
<input type="password" id="login-password" placeholder="Password" required>
</div>

<div class="forgot">
Forgot Password?
</div>

<button type="submit">
Login
</button>

</form>

<div class="toggle-text">
Don't have an account?
<a onclick="showSignup()">Sign Up</a>
</div>

</div>

<!-- SIGNUP -->

<div id="signup-form" class="hidden">

<h3 class="form-title">Create Account</h3>

<form id="register-form">

<div class="form-group">
<input type="text" id="register-name" placeholder="Full Name" required>
</div>

<div class="form-group">
<input type="email" id="register-email" placeholder="Email Address" required>
</div>

<div class="form-group">
<input type="password" id="register-password" placeholder="Password" required>
</div>

<button type="submit">
Create Account
</button>

</form>

<div class="toggle-text">
Already have an account?
<a onclick="showLogin()">Sign In</a>
</div>

</div>

</div>

</div>

</div>


<script>
  const authThemeToggle = document.getElementById('auth-theme-toggle');
  const setAuthTheme = (theme) => {
    if (theme === 'light') document.body.dataset.theme = 'light';
    else delete document.body.dataset.theme;
    const isLight = document.body.dataset.theme === 'light';
    authThemeToggle.innerHTML = `<i class="ri-${isLight ? 'moon-clear-line' : 'sun-line'}"></i><span>${isLight ? 'Dark' : 'Light'}</span>`;
    authThemeToggle.setAttribute('aria-label', `Switch to ${isLight ? 'dark' : 'light'} mode`);
  };
  setAuthTheme(localStorage.getItem('venyora-theme'));
  authThemeToggle.addEventListener('click', () => {
    const nextTheme = document.body.dataset.theme === 'light' ? 'dark' : 'light';
    localStorage.setItem('venyora-theme', nextTheme);
    setAuthTheme(nextTheme);
  });

  function showSignup() {
    document.getElementById('login-form').classList.add('hidden');
    document.getElementById('signup-form').classList.remove('hidden');
  }

  function showLogin() {
    document.getElementById('signup-form').classList.add('hidden');
    document.getElementById('login-form').classList.remove('hidden');
  }

  /* ================= REGISTER ================= */
  document.getElementById('register-form').addEventListener('submit', async e => {
    e.preventDefault();

    const name = document.getElementById('register-name').value;
    const email = document.getElementById('register-email').value;
    const password = document.getElementById('register-password').value;

    try {
      const res = await fetch('https://venyora-ecommerce.onrender.com/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });

      const data = await res.json();

      if (res.ok) {
        alert('Registration successful!');
        showLogin();
        e.target.reset();
      } else {
        alert(data.message || 'Registration failed');
      }
    } catch (err) {
      alert('Server error during registration');
    }
  });

  /* ================= LOGIN ================= */
  document.getElementById('login-form-element').addEventListener('submit', async e => {
    e.preventDefault();

    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;

    try {
      const res = await fetch('https://venyora-ecommerce.onrender.com/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (!res.ok) {
        alert('Invalid credentials');
        return;
      }

      localStorage.setItem('venyora-token', data.token);
      localStorage.removeItem('venyoraGuestCart');

      // Decode token
      const payload = JSON.parse(atob(data.token.split('.')[1]));
      const role = payload.user.role;

      // Redirect based on role
      if (role === "admin") {
        window.location.href = "admin/admin.html";
      } else {
        window.location.href = "index.html";
    }
    
    } catch (err) {
      alert('Server error during login');
    }
  });
</script>

</body>
</html>
