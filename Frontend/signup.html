<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VENYORA | Luxury Fashion</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#f7f3ee;
min-height:100vh;
}

.wrapper{
display:flex;
min-height:100vh;
}

/* LEFT SIDE */

.left{
flex:1;
overflow:hidden;
position:relative;
}

.left img{
width:100%;
height:100vh;
object-fit:cover;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,0.25);
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
}

.overlay-content{
color:white;
}

.overlay-content h1{
font-family:'Cormorant Garamond',serif;
font-size:72px;
letter-spacing:8px;
font-weight:600;
}

.overlay-content p{
margin-top:15px;
font-size:16px;
letter-spacing:3px;
}

/* RIGHT */

.right{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:40px;
background:#f7f3ee;
}

.auth-card{
width:100%;
max-width:450px;
background:rgba(255,255,255,0.9);
backdrop-filter:blur(15px);
padding:50px;
border-radius:24px;
box-shadow:0 20px 50px rgba(0,0,0,0.08);
border:1px solid rgba(0,0,0,0.05);
}

/* BRAND */

.brand{
font-family:'Cormorant Garamond',serif;
font-size:52px;
letter-spacing:8px;
text-align:center;
color:#111;
}

.tagline{
text-align:center;
margin-top:5px;
margin-bottom:35px;
font-size:13px;
letter-spacing:3px;
color:#888;
}

.form-title{
text-align:center;
font-size:24px;
margin-bottom:30px;
font-weight:500;
color:#111;
}

/* INPUTS */

.form-group{
margin-bottom:22px;
}

input{
width:100%;
padding:14px 0;
border:none;
border-bottom:1px solid #ddd;
background:transparent;
font-size:15px;
transition:.3s;
}

input:focus{
outline:none;
border-bottom:1px solid #b89b72;
}

/* FORGOT */

.forgot{
text-align:right;
margin-bottom:25px;
font-size:14px;
color:#777;
cursor:pointer;
}

/* BUTTON */

button{
width:100%;
padding:15px;
border:none;
background:#111;
color:white;
letter-spacing:2px;
text-transform:uppercase;
font-size:13px;
font-weight:600;
cursor:pointer;
transition:.3s;
border-radius:10px;
}

button:hover{
background:#b89b72;
}

/* TOGGLE */

.toggle-text{
margin-top:25px;
text-align:center;
font-size:14px;
color:#666;
}

.toggle-text a{
color:#b89b72;
font-weight:600;
cursor:pointer;
text-decoration:none;
}

.hidden{
display:none;
}

/* MOBILE */

@media(max-width:950px){

.wrapper{
flex-direction:column;
}

.left{
height:260px;
flex:none;
}

.left img{
height:260px;
}

.overlay-content h1{
font-size:48px;
}

.auth-card{
margin-top:-40px;
padding:35px 25px;
border-radius:20px;
}

.brand{
font-size:42px;
}

}

@media(max-width:500px){

.left{
display:none;
}

.right{
padding:20px;
}

.auth-card{
padding:30px 22px;
}

.brand{
font-size:36px;
letter-spacing:5px;
}

.tagline{
font-size:11px;
letter-spacing:2px;
}

.form-title{
font-size:22px;
}

}

</style>
</head>

<body>

<div class="wrapper">

<div class="left">

<img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=1200" alt="Fashion">

<div class="overlay">
<div class="overlay-content">
<h1>VENYORA</h1>
<p>ELEGANCE IN EVERY THREAD</p>
</div>
</div>

</div>

<div class="right">

<div class="auth-card">

<h1 class="brand">VENYORA</h1>
<p class="tagline">LUXURY FASHION REDEFINED</p>

<!-- LOGIN -->

<div id="login-form">

<h3 class="form-title">Welcome Back</h3>

<form id="login-form-element">

<div class="form-group">
<input type="email" id="login-email" placeholder="Email Address" required>
</div>

<div class="form-group">
<input type="password" id="login-password" placeholder="Password" required>
</div>

<div class="forgot">
Forgot Password?
</div>

<button type="submit">
Login
</button>

</form>

<div class="toggle-text">
Don't have an account?
<a onclick="showSignup()">Sign Up</a>
</div>

</div>

<!-- SIGNUP -->

<div id="signup-form" class="hidden">

<h3 class="form-title">Create Account</h3>

<form id="register-form">

<div class="form-group">
<input type="text" id="register-name" placeholder="Full Name" required>
</div>

<div class="form-group">
<input type="email" id="register-email" placeholder="Email Address" required>
</div>

<div class="form-group">
<input type="password" id="register-password" placeholder="Password" required>
</div>

<button type="submit">
Create Account
</button>

</form>

<div class="toggle-text">
Already have an account?
<a onclick="showLogin()">Sign In</a>
</div>

</div>

</div>

</div>

</div>


<script>
  function showSignup() {
    document.getElementById('login-form').classList.add('hidden');
    document.getElementById('signup-form').classList.remove('hidden');
  }

  function showLogin() {
    document.getElementById('signup-form').classList.add('hidden');
    document.getElementById('login-form').classList.remove('hidden');
  }

  /* ================= REGISTER ================= */
  document.getElementById('register-form').addEventListener('submit', async e => {
    e.preventDefault();

    const name = document.getElementById('register-name').value;
    const email = document.getElementById('register-email').value;
    const password = document.getElementById('register-password').value;

    try {
      const res = await fetch('https://venyora-ecommerce.onrender.com/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });

      const data = await res.json();

      if (res.ok) {
        alert('Registration successful!');
        showLogin();
        e.target.reset();
      } else {
        alert(data.message || 'Registration failed');
      }
    } catch (err) {
      alert('Server error during registration');
    }
  });

  /* ================= LOGIN ================= */
  document.getElementById('login-form-element').addEventListener('submit', async e => {
    e.preventDefault();

    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;

    try {
      const res = await fetch('https://venyora-ecommerce.onrender.com/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (!res.ok) {
        alert('Invalid credentials');
        return;
      }

      localStorage.setItem('venyora-token', data.token);
      localStorage.removeItem('venyoraGuestCart');

      // Decode token
      const payload = JSON.parse(atob(data.token.split('.')[1]));
      const role = payload.user.role;

      // Redirect based on role
      if (role === "admin") {
        window.location.href = "admin/admin.html";
      } else {
        window.location.href = "index.html";
    }
    
    } catch (err) {
      alert('Server error during login');
    }
  });
</script>

</body>
</html>
